name: iOS Patrol Test with Recording

on:
  workflow_dispatch:

jobs:
  patrol-ios:
    runs-on: macos-latest
    timeout-minutes: 20 # MODIFIED: was 25 (a run takes ~14 min)
    env:
      IOS_MAJOR: '18' # ADDED: preferred simulator iOS major version ('' = always use the newest)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # ffmpeg installs in the background while everything else runs (waited for in "Optimize recording size")
      - name: Install ffmpeg (background)
        shell: bash
        run: |
          rm -f /tmp/ffmpeg.done
          if command -v ffmpeg > /dev/null 2>&1; then
            touch /tmp/ffmpeg.done
          else
            nohup bash -c 'export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1; brew install ffmpeg > /tmp/ffmpeg-install.log 2>&1; touch /tmp/ffmpeg.done' > /dev/null 2>&1 &
          fi

      # faster xcodebuild - no index store, arm64-only simulator slices (runner is arm64)
      - name: Configure fast xcodebuild settings
        shell: bash
        run: |
          XCFG="$RUNNER_TEMP/ci-fast.xcconfig"
          echo 'COMPILER_INDEX_STORE_ENABLE = NO' > "$XCFG"
          if [ "$(uname -m)" = "arm64" ]; then
            echo 'EXCLUDED_ARCHS[sdk=iphonesimulator*] = x86_64 i386' >> "$XCFG"
          fi
          echo "XCODE_XCCONFIG_FILE=$XCFG" >> "$GITHUB_ENV"
          cat "$XCFG"

      # boots in the background while Flutter/Patrol setup runs
      - name: Boot iOS Simulator
        id: simulator
        run: |
          # ADDED: print installed runtimes for debugging
          xcrun simctl list runtimes | grep iOS || true

          # MODIFIED: prefer the IOS_MAJOR runtime (faster on CI), fall back to the newest installed one
          pick_runtime() {
            xcrun simctl list runtimes \
              | grep -E "$1" \
              | grep -vi unavailable \
              | sort -t' ' -k2 -Vr \
              | head -1 \
              | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+'
          }
          RUNTIME=""
          if [ -n "$IOS_MAJOR" ]; then
            RUNTIME=$(pick_runtime "iOS ${IOS_MAJOR}\.[0-9]+ ") || RUNTIME=""
          fi
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(pick_runtime 'iOS [0-9]+\.[0-9]+ ')
          fi
          echo "Selected runtime: $RUNTIME"
          DEVICE_ID=$(xcrun simctl create "Patrol-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME")
          xcrun simctl boot "$DEVICE_ID"
          echo "udid=$DEVICE_ID" >> $GITHUB_OUTPUT
          # the wait for boot happens in "Run Patrol test with recording"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: false # MODIFIED: was true (restoring the ~2 GB SDK cache took 2m53s)

      # ADDED: fewer device discoverers for `flutter devices` (Patrol calls it before every build)
      - name: Trim Flutter device discovery
        run: flutter config --no-analytics --no-cli-animations --no-enable-android --no-enable-web --no-enable-macos-desktop --no-enable-linux-desktop --no-enable-windows-desktop || echo "::warning::flutter config failed (non-fatal)"

      # cache pub packages + patched Patrol CLI (skips CLI activation and rebuild on later runs)
      - name: Cache pub packages and Patrol CLI
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-patrolcli4.10.0-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ runner.arch }}-patrolcli4.10.0-

      - name: Flutter pub get
        run: flutter pub get

      # pinned version, activation skipped when restored from cache
      - name: Install Patrol CLI
        run: |
          if ! dart pub global list | grep -q "patrol_cli 4.10.0"; then
            dart pub global activate patrol_cli 4.10.0
          fi

      - name: Add pub cache bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # MODIFIED: patch + snapshot removal only when the patch is still needed (a cached CLI is already patched and compiled)
      - name: Patch Patrol CLI destination timeout and destination format
        run: |
          PATROL_CLI_PATH=$(find "$HOME/.pub-cache" -type d -name "patrol_cli-4.10.0" | head -1)
          echo "Patrol CLI at: $PATROL_CLI_PATH"
          if grep -rEq "destination-timeout['\"],[[:space:]]*['\"]1['\"]" "$PATROL_CLI_PATH/lib"; then # ADDED: only when not patched yet
            echo "Patching destination-timeout 1 -> 120"
            find "$PATROL_CLI_PATH/lib" -type f -name "*.dart" -exec perl -pi -e "s/'-destination-timeout',\s*'1'/'-destination-timeout', '120'/g" {} \;
            find "$PATROL_CLI_PATH/lib" -type f -name "*.dart" -exec perl -pi -e 's/"-destination-timeout",\s*"1"/"-destination-timeout", "120"/g' {} \;
            # Remove stale snapshot so patched source is used (MODIFIED: now only after a real patch)
            rm -f ~/.pub-cache/global_packages/patrol_cli/bin/main.dart-*.snapshot 2>/dev/null || true
            echo "Snapshot removed"
          else
            echo "Already patched - keeping compiled snapshot" # ADDED:
          fi
          echo "=== Verification: destination-timeout occurrences ==="
          grep -rn "destination-timeout" "$PATROL_CLI_PATH/lib" | head -10

      - name: Run Patrol test with recording
        shell: bash
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          APP_ID="com.example.helloFlutter"
          VIDEO=/tmp/patrol-recording.mp4
          rm -f "$VIDEO"

          xcrun simctl bootstatus "$UDID" -b # wait for the simulator booted earlier (usually already ready)

          set -m # job control, so the background recorder gets a default SIGINT handler (required for a clean stop)

          # Background watcher - waits for the app process, then starts recording
          (
            until xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -F "UIKitApplication:$APP_ID" > /dev/null; do
              sleep 0.5
            done
            echo ">>> App launched - recording started"
            exec xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$VIDEO"
          ) &
          WATCHER_PID=$!

          set +e
          patrol test \
            --target patrol_test/app_test.dart \
            --device "$UDID" \
            --verbose
          STATUS=$?
          set -e

          sleep 2 # capture the final frames of the test

          # graceful stop - SIGINT first, wait up to 30s for the MP4 to finalize
          kill -INT "$WATCHER_PID" 2>/dev/null || true
          for _ in $(seq 1 60); do
            kill -0 "$WATCHER_PID" 2>/dev/null || break
            sleep 0.5
          done
          # SIGTERM only as a last resort (can corrupt the file)
          if kill -0 "$WATCHER_PID" 2>/dev/null; then
            echo "::warning::Recorder did not exit within 30s, forcing stop"
            kill -TERM "$WATCHER_PID" 2>/dev/null || true
          fi
          wait "$WATCHER_PID" 2>/dev/null || true

          # show what was produced
          ls -l "$VIDEO" 2>/dev/null || echo "::warning::No recording file produced"
          exit $STATUS

      # safe optimization - verified output, falls back to the raw recording
      - name: Optimize recording size
        if: always()
        shell: bash
        run: |
          RAW=/tmp/patrol-recording.mp4
          OPT=/tmp/patrol-recording-optimized.mp4
          FINAL=/tmp/patrol-recording-final.mp4

          if [ ! -s "$RAW" ]; then
            echo "::warning::No recording file found"
            exit 0
          fi

          # wait for the background ffmpeg install (normally finished long ago)
          for _ in $(seq 1 600); do
            [ -f /tmp/ffmpeg.done ] && break
            sleep 0.5
          done
          tail -n 3 /tmp/ffmpeg-install.log 2>/dev/null || true

          # Raw file sanity check
          ffprobe -v error -show_entries format=duration -of default=nw=1 "$RAW" || echo "::warning::Raw recording is not readable by ffprobe"

          # Re-encode: 720px wide (even height), 30fps, yuv420p; then verify the result fully decodes
          if command -v ffmpeg > /dev/null \
            && ffmpeg -y -v error -i "$RAW" \
                 -vf "fps=30,scale=720:-2,format=yuv420p" \
                 -c:v libx264 -preset veryfast -crf 26 \
                 -movflags +faststart -an "$OPT" \
            && ffmpeg -v error -i "$OPT" -f null - ; then
            echo "Optimization OK"
            cp "$OPT" "$FINAL"
          else
            echo "::warning::Optimization failed or ffmpeg missing - using raw recording"
            cp "$RAW" "$FINAL"
          fi
          ls -lh /tmp/patrol-recording*.mp4

      # upload only the optimized file
      - name: Upload recording artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-recording
          path: /tmp/patrol-recording-final.mp4
          if-no-files-found: warn
          compression-level: 0