name: iOS Patrol Test with Recording

on:
  workflow_dispatch:

jobs:
  patrol-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - name: Add pub cache bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # MODIFIED: more robust patch using perl to handle various source formats
      - name: Patch Patrol CLI destination timeout and destination format
        run: |
          PATROL_CLI_PATH=$(find "$HOME/.pub-cache" -type d -name "patrol_cli-*" | head -1)
          echo "Patching patrol_cli at: $PATROL_CLI_PATH"
          # Increase destination timeout from 1 to 120
          find "$PATROL_CLI_PATH/lib" -type f -name "*.dart" -exec perl -pi -e "s/'-destination-timeout',\s*'1'/'-destination-timeout', '120'/g" {} \;
          find "$PATROL_CLI_PATH/lib" -type f -name "*.dart" -exec perl -pi -e 's/"-destination-timeout",\s*"1"/"-destination-timeout", "120"/g' {} \;
          # Verify patch applied
          echo "=== Verification: destination-timeout occurrences ==="
          grep -rn "destination-timeout" "$PATROL_CLI_PATH/lib" | head -10
          # Remove stale snapshot so patched source is used
          rm -f ~/.pub-cache/global_packages/patrol_cli/bin/main.dart-*.snapshot 2>/dev/null || true
          echo "Snapshot removed if present"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Boot iOS Simulator
        id: simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes \
            | grep -E 'iOS [0-9]+\.[0-9]+ ' \
            | sort -t' ' -k2 -Vr \
            | head -1 \
            | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+')
          echo "Selected runtime: $RUNTIME"
          DEVICE_ID=$(xcrun simctl create "Patrol-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME")
          xcrun simctl boot "$DEVICE_ID"
          echo "udid=$DEVICE_ID" >> $GITHUB_OUTPUT
          xcrun simctl bootstatus "$DEVICE_ID" -b

      # REMOVED: "Start screen recording" step (it recorded the whole build). Recording now starts inside the step below.

      # MODIFIED: renamed; recording starts only when the app process launches and stops right after the test
      - name: Run Patrol test with recording
        shell: bash # ADDED: explicit bash (pipefail, consistent behavior)
        run: |
          UDID="${{ steps.simulator.outputs.udid }}" # ADDED:
          APP_ID="com.example.helloFlutter" # ADDED: iOS bundle id from project.pbxproj
          VIDEO=/tmp/patrol-recording.mp4 # ADDED:
          rm -f "$VIDEO" # ADDED:

          # ADDED: background watcher - waits for the app process, then starts recording
          (
            until xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -F "UIKitApplication:$APP_ID" > /dev/null; do
              sleep 0.5
            done
            echo ">>> App launched - recording started"
            exec xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$VIDEO"
          ) &
          WATCHER_PID=$!

          set +e # ADDED: keep going after test failure so recording is always stopped
          patrol test \
            --target patrol_test/app_test.dart \
            --device "$UDID" \
            --verbose
          STATUS=$? # ADDED:
          set -e # ADDED:

          # ADDED: stop recording right after the test and wait for the file to finalize
          kill -INT "$WATCHER_PID" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$WATCHER_PID" 2>/dev/null || break
            sleep 0.5
          done
          kill -TERM "$WATCHER_PID" 2>/dev/null || true
          wait "$WATCHER_PID" 2>/dev/null || true
          exit $STATUS

      # REMOVED: "Stop screen recording" step (handled inside "Run Patrol test with recording")

      - name: Optimize recording size
        if: always()
        run: |
          if [ -f /tmp/patrol-recording.mp4 ]; then
            # ADDED: print duration to verify the recording is valid and short
            ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/patrol-recording.mp4
            ffmpeg -y -i /tmp/patrol-recording.mp4 \
              -c:v libx264 -crf 28 -preset fast -movflags +faststart \
              -an /tmp/patrol-recording-optimized.mp4
            ls -lh /tmp/patrol-recording*.mp4
          else
            echo "No recording file found"
          fi

      - name: Upload recording artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-recording
          path: /tmp/patrol-recording-optimized.mp4
          if-no-files-found: warn