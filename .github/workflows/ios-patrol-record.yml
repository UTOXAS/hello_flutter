name: iOS Patrol Test with Recording

on:
  workflow_dispatch:

jobs:
  patrol-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - name: Add pub cache bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # MODIFIED: more robust patch using perl to handle various source formats
      - name: Patch Patrol CLI destination timeout and destination format
        run: |
          PATROL_CLI_PATH=$(find "$HOME/.pub-cache" -type d -name "patrol_cli-*" | head -1)
          echo "Patching patrol_cli at: $PATROL_CLI_PATH"
          # Increase destination timeout from 1 to 120
          find "$PATROL_CLI_PATH/lib" -type f -name "*.dart" -exec perl -pi -e "s/'-destination-timeout',\s*'1'/'-destination-timeout', '120'/g" {} \;
          find "$PATROL_CLI_PATH/lib" -type f -name "*.dart" -exec perl -pi -e 's/"-destination-timeout",\s*"1"/"-destination-timeout", "120"/g' {} \;
          # Verify patch applied
          echo "=== Verification: destination-timeout occurrences ==="
          grep -rn "destination-timeout" "$PATROL_CLI_PATH/lib" | head -10
          # Remove stale snapshot so patched source is used
          rm -f ~/.pub-cache/global_packages/patrol_cli/bin/main.dart-*.snapshot 2>/dev/null || true
          echo "Snapshot removed if present"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Boot iOS Simulator
        id: simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes \
            | grep -E 'iOS [0-9]+\.[0-9]+ ' \
            | sort -t' ' -k2 -Vr \
            | head -1 \
            | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+')
          echo "Selected runtime: $RUNTIME"
          DEVICE_ID=$(xcrun simctl create "Patrol-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME")
          xcrun simctl boot "$DEVICE_ID"
          echo "udid=$DEVICE_ID" >> $GITHUB_OUTPUT
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Start screen recording
        run: |
          xcrun simctl io booted recordVideo --codec=h264 /tmp/patrol-recording.mp4 &
          echo "RECORDING_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run Patrol test
        run: |
          patrol test \
            --target patrol_test/app_test.dart \
            --device ${{ steps.simulator.outputs.udid }} \
            --verbose

      - name: Stop screen recording
        if: always()
        run: |
          kill -INT $RECORDING_PID || true
          sleep 3

      - name: Optimize recording size
        if: always()
        run: |
          if [ -f /tmp/patrol-recording.mp4 ]; then
            ffmpeg -i /tmp/patrol-recording.mp4 \
              -c:v libx264 -crf 28 -preset fast -movflags +faststart \
              -an /tmp/patrol-recording-optimized.mp4
            ls -lh /tmp/patrol-recording*.mp4
          else
            echo "No recording file found"
          fi

      - name: Upload recording artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-recording
          path: /tmp/patrol-recording-optimized.mp4
          if-no-files-found: warn